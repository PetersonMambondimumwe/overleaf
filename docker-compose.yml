# Overleaf Community Edition — LOCAL / plain Docker deployment
#
# Publishes port 80 on the host, so it is meant for a machine where you control
# the ports (your laptop or a bare server).
#
#   docker compose up -d
#
# IMPORTANT: on Dokploy (or any host where Traefik/nginx already owns port 80)
# use docker-compose.dokploy.yml instead — see DOKPLOY.md. This file will fail
# with "Bind for 0.0.0.0:80 failed: port is already allocated" there.
#
# All site-specific settings live in .env (copy .env.example to .env).
# Deployment guide: SELFHOST.md

name: overleaf

services:
  sharelatex:
    restart: always
    # Overlay image: the release image plus this repo's Clerk sign-in changes.
    # `docker compose up -d --build` rebuilds in seconds after a code change.
    image: ${OVERLEAF_IMAGE:-overleaf-clerk:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OVERLEAF_RELEASE_TAG: ${OVERLEAF_IMAGE_TAG:-latest}
        TEXLIVE_PROFILE: ${TEXLIVE_PROFILE:-academic}
    container_name: sharelatex
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${OVERLEAF_PORT:-80}:80"
    stop_grace_period: 60s
    volumes:
      # Projects, uploads, compiles and templates.
      - sharelatex_data:/var/lib/overleaf
      ########################################################################
      ####  Server Pro: Uncomment the following line to mount the docker  ####
      ####             socket, required for Sibling Containers to work    ####
      ########################################################################
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # ---- Site identity -------------------------------------------------
      OVERLEAF_APP_NAME: ${OVERLEAF_APP_NAME:-Overleaf Community Edition}
      OVERLEAF_SITE_URL: ${OVERLEAF_SITE_URL:-http://localhost}
      OVERLEAF_ADMIN_EMAIL: ${OVERLEAF_ADMIN_EMAIL:-}

      # ---- Required secret ------------------------------------------------
      # Signs invite tokens. Generate with: openssl rand -base64 32
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET:?Set OVERLEAF_INVITE_TOKEN_SECRET in .env}

      # ---- Backing services -----------------------------------------------
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # ---- Features -------------------------------------------------------
      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"

      # Enables Thumbnail generation using ImageMagick
      ENABLE_CONVERSIONS: "true"

      # Disables email confirmation requirement
      EMAIL_CONFIRMATION_DISABLED: "true"

      # ---- Google sign-in via Clerk ----------------------------------------
      # /login renders the Clerk sign-in page; /login/classic stays available
      # for password login as an admin fallback.
      OVERLEAF_CLERK_ENABLED: ${OVERLEAF_CLERK_ENABLED:-false}
      OVERLEAF_CLERK_PUBLISHABLE_KEY: ${OVERLEAF_CLERK_PUBLISHABLE_KEY:-}
      OVERLEAF_CLERK_SECRET_KEY: ${OVERLEAF_CLERK_SECRET_KEY:-}
      OVERLEAF_CLERK_ALLOWED_DOMAINS: ${OVERLEAF_CLERK_ALLOWED_DOMAINS:-}
      # Optional, only needed when the publishable key is not the classic format.
      OVERLEAF_CLERK_FRONTEND_API: ${OVERLEAF_CLERK_FRONTEND_API:-}
      # ---- AI writing assistant (OpenRouter / Anthropic) ------------------
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OVERLEAF_AI_MODEL: ${OVERLEAF_AI_MODEL:-google/gemini-2.5-flash}
      OVERLEAF_AI_MAX_INPUT_CHARS: ${OVERLEAF_AI_MAX_INPUT_CHARS:-6000}
      OVERLEAF_AI_MAX_OUTPUT_TOKENS: ${OVERLEAF_AI_MAX_OUTPUT_TOKENS:-1024}
      OVERLEAF_AI_REQUESTS_PER_MINUTE: ${OVERLEAF_AI_REQUESTS_PER_MINUTE:-15}

      # ---- Outgoing email (optional) --------------------------------------
      # Set these in .env; without SMTP, emails are written to the container log.
      # OVERLEAF_EMAIL_FROM_ADDRESS: ${OVERLEAF_EMAIL_FROM_ADDRESS:-}
      # OVERLEAF_EMAIL_SMTP_HOST: ${OVERLEAF_EMAIL_SMTP_HOST:-}
      # OVERLEAF_EMAIL_SMTP_PORT: ${OVERLEAF_EMAIL_SMTP_PORT:-}
      # OVERLEAF_EMAIL_SMTP_SECURE: ${OVERLEAF_EMAIL_SMTP_SECURE:-}
      # OVERLEAF_EMAIL_SMTP_USER: ${OVERLEAF_EMAIL_SMTP_USER:-}
      # OVERLEAF_EMAIL_SMTP_PASS: ${OVERLEAF_EMAIL_SMTP_PASS:-}

      ################
      ## Server Pro ##
      ################
      ## The Community Edition is intended for use in environments where all users are trusted and is not appropriate for
      ## scenarios where isolation of users is required. Sandboxed Compiles are not available in the Community Edition,
      ## so the following environment variables must be commented out to avoid compile issues.
      ##
      ## Sandboxed Compiles: https://docs.overleaf.com/on-premises/configuration/overleaf-toolkit/server-pro-only-configuration/sandboxed-compiles
      # SANDBOXED_COMPILES: "true"
      # SANDBOXED_COMPILES_HOST_DIR_COMPILES: "/home/user/sharelatex_data/data/compiles"
      # SANDBOXED_COMPILES_HOST_DIR_OUTPUT: "/home/user/sharelatex_data/data/output"
      # DOCKER_RUNNER: "true"
      # SANDBOXED_COMPILES_SIBLING_CONTAINERS: "true"

  mongo:
    restart: always
    image: mongo:8.0
    container_name: mongo
    command: "--replSet overleaf"
    volumes:
      - mongo_data:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      # Required when using the automatic database setup for initializing the replica set.
      # This override is not needed when running the setup after starting up mongo.
      - mongo:127.0.0.1
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    restart: always
    image: redis:6.2
    container_name: redis
    volumes:
      - redis_data:/data

volumes:
  # Named volumes keep database files on the Docker VM disk, which is orders of
  # magnitude faster than a bind mount on Windows/macOS and survives `docker compose up`
  # recreations. See SELFHOST.md for backup and restore commands.
  sharelatex_data:
  mongo_data:
  redis_data:
